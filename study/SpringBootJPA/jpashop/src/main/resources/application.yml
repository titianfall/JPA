spring:
  application:
    name: jpashop
  # 콘솔 로그 색상 출력 (기본값 detect 는 Gradle 로 실행하면 감지에 실패해서 색이 안 나온다)
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:h2:tcp://localhost/~/jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
        default_batch_fetch_size: 100 # 컬렉션의 요소들을 한번에 100개까지 가져옴

logging.level:
  org.hibernate.SQL: debug
  # 쿼리 파라미터 로그 (스프링 부트 3.x, hibernate6)
  # org.hibernate.orm.jdbc.bind: trace
